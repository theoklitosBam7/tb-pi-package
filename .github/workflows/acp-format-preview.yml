name: ACP format preview (temporary)
on:
  push:
    branches: [feat/acp-agent-secure]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt extensions/acp-agent
      - run: node -e 'const fs=require("node:fs");for(const p of ["pool.ts","pool.test.ts","README.md"]){console.log("ACPFMT "+p+" "+fs.readFileSync("extensions/acp-agent/"+p).toString("base64"))}'
